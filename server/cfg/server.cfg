// =====================================================
// [SS] CubeNet Idle 2Fort Server
// =====================================================


// =====================================================
// SERVER IDENTITY
// =====================================================

hostname "[SS] Idle"

sv_password ""

sv_lan 0

sv_region 0

sv_tags "cubenet,2fort,idle,bots,24/7"


// Player slots

maxplayers 24

sv_visiblemaxplayers 24



// =====================================================
// SECURITY
// =====================================================

sv_cheats 0

sv_pure 1


// Voice

sv_alltalk 0

sv_voiceenable 1


// Disable votes

sv_allow_votes 0



// =====================================================
// RCON
// =====================================================

rcon_password "PinkPants1!"



// =====================================================
// GAMEPLAY
// =====================================================

// Never rotate map

mp_timelimit 0


// Never end by score

mp_winlimit 0


// Never end by rounds

mp_maxrounds 0


// CTF settings

tf_flag_caps_per_round 0


// Long rounds

mp_roundtime 9999


// Disable stalemate

mp_stalemate_enable 0


mp_bonusroundtime 0



// =====================================================
// TEAM BALANCE
// =====================================================

mp_autoteambalance 1

mp_teams_unbalance_limit 1



// =====================================================
// BOT SETTINGS
// =====================================================

// Fixed number of bots
tf_bot_quota 20

// Do not fill empty slots
tf_bot_quota_mode normal

// Bot difficulty
tf_bot_difficulty 2

// Join immediately
tf_bot_join_after_player 0

// Never remove bots
tf_bot_auto_vacate 1

// Let bots choose classes
tf_bot_force_class ""

tf_bot_keep_class_after_death 1

// Objective behavior
tf_bot_offense_must_push_time 30
tf_bot_defense_must_push_time 45



// =====================================================
// IDLE SETTINGS
// =====================================================


// Never kick idle players

mp_idlemaxtime 0

mp_idledealmethod 0


// Allow spectators

mp_allowspectators 1



// =====================================================
// NETWORK
// =====================================================

sv_maxrate 0

sv_minrate 80000


sv_maxupdaterate 66

sv_minupdaterate 66


sv_maxcmdrate 66

sv_mincmdrate 66



// =====================================================
// DOWNLOADS
// =====================================================

sv_downloadurl ""

net_maxfilesize 64



// =====================================================
// LOGGING
// =====================================================

sv_logbans 1

sv_log_onefile 0



// =====================================================
// MAP CONTROL
// =====================================================

mapcyclefile "cfg/mapcycle.txt"



exec banned_user.cfg

exec banned_ip.cfg


writeid

writeip



echo "[SS] Server.cfg Loaded"